version: '3.8'

services:
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        MODE: app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true  # Mejora la detección de cambios
    restart: unless-stopped

  frontend-widget:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        MODE: widget
    # Mapeamos el puerto interno 5173 a otro puerto en el host (por ejemplo, 5174)
    ports:
      - "5174:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/app:/app/app
      - uploaded_files:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploaded_files:
