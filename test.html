<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba del Widget NOA</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <h1>Prueba del Widget NOA</h1>
    <p>Esta es una página de prueba para el widget embebible de NOA.</p>

    <!-- Bloque de configuración del widget -->
    <script>
      window.NOA = {
        config: {
          apiKey: 'your-api-key',
          theme: 'light',
          position: 'bottom-right',
          type: 'bubble',
          bubbleConfig: {
            initialMessage: '¡Hola! ¿En qué puedo ayudarte?',
            title: 'Optica Trento',
            subtitle: 'Resuelve tus dudas al instante',
            primaryColor: '#3f9d25',
            secondaryColor: '#3f9d25',
            textColor: '#1f2937',
            fontSize: '14px',
            fontFamily: 'Poppins'
          }
        }
      };
    </script>

    <!-- Actualiza la URL del widget para que apunte al puerto correcto -->
    <script src="http://localhost:5174/widget.js"></script>
  </body>
</html>
